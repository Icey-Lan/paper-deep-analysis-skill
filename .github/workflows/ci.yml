name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest --cov --cov-report=term
      - run: python scripts/release_audit.py
      - run: python scripts/build_release.py --output-dir "${RUNNER_TEMP}/paper-deep-analysis-release"

  skill-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install 'git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
      - run: skills-ref validate .agents/skills/paper-deep-analysis
      - run: skills-ref validate .claude/skills/paper-deep-analysis

  dsh-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify dsh/assets matches canonical byte-for-byte
        run: python dsh/sync-assets.py --check
      - name: Bootstrap the runtime venv (exercises the plugin's self-bootstrap)
        run: python dsh/assets/bootstrap.py --dir .work/venv
      - name: Smoke: preflight through the bootstrapped venv
        run: |
          .work/venv/bin/python dsh/assets/scripts/preflight.py "2607.26637" \
            --output-dir .work/smoke > .work/smoke.json
          python - <<'EOF'
          import json
          result = json.load(open(".work/smoke.json"))
          assert result["status"] == "pass", result["errors"]
          required = {"python-version", "dependencies", "skill-files", "output-target"}
          assert required <= set(result["checks_passed"]), result
          print("dsh-plugin smoke: runtime + skill files OK")
          EOF
      - name: npm pack dry-run (validate publish contents)
        run: |
          cd dsh && npm pack --dry-run --json > pack.json
          python - <<'EOF'
          import json
          data = json.load(open("pack.json"))
          files = {entry["path"] for entry in data[0]["files"]}
          required = {
            "package.json", "cordis.patch.yml", "lib/index.js",
            "assets/SKILL.md", "assets/bootstrap.py", "assets/scripts/preflight.py",
            "assets/references/analysis.schema.json", "requirements.txt", "README.md",
          }
          assert required <= files, required - files
          print("npm pack ok:", len(files), "files, tarball", data[0].get("size"), "bytes")
          EOF
