[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-deep-analysis-skill"
version = "0.1.1"
description = "A portable Agent Skill for evidence-grounded paper analysis and offline HTML reports."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "jsonschema>=4.21,<5",
  "pypdf>=5,<7",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "PyYAML>=6,<7",
  "reportlab>=4,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["paperlib"]

[tool.setuptools]
packages = []
